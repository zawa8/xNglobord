name: Build Windows EXE

on:
  push:
    branches: [windoz_porting]
    paths: ["windows/**", ".github/workflows/build-exe.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build standalone EXE
        working-directory: windows
        run: >
          pyinstaller --onefile --windowed --name xNglobord
          --add-data "fonts;fonts"
          --add-data "dictionaries;dictionaries"
          xnglo_tk.py

      - name: Rename EXE with build number
        run: |
          mkdir out
          copy windows\dist\xNglobord.exe "out\xNglobord-${{ github.run_number }}.exe"

      - name: Upload EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xNglobord-windows-exe
          path: out/*.exe

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: "Windows Build ${{ github.run_number }}"
          files: out/*.exe
