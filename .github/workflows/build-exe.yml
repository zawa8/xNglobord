name: Build Windows EXE (native C#)

on:
  push:
    branches: [windoz_porting]
    paths: ["windows-native/**", ".github/workflows/build-exe.yml"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained single-file EXE
        working-directory: windows-native/XngloBord
        run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o out_publish

      - name: Package exe + dictionaries into a zip
        shell: pwsh
        run: |
          $pkgName = "xNglobord-${{ github.run_number }}"
          $pkgDir = "out\$pkgName"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null
          Copy-Item "windows-native\XngloBord\out_publish\xNglobord.exe" "$pkgDir\xNglobord.exe"
          Copy-Item "windows-native\XngloBord\out_publish\dictionaries" "$pkgDir\dictionaries" -Recurse
          Compress-Archive -Path "$pkgDir\*" -DestinationPath "out\$pkgName.zip"

      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xNglobord-windows-exe
          path: out/*.zip

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: "Windows Build ${{ github.run_number }}"
          files: out/*.zip
