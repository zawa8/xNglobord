name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No explicit Android SDK setup step: android-actions/setup-android@v3
      # tries to install the legacy 'tools' package, which Google has
      # removed from the SDK repository, so the action now fails outright
      # ("Failed to find package 'tools'"). ubuntu-latest already ships a
      # working Android SDK (ANDROID_HOME preset, platforms/build-tools
      # for compileSdk 34 already present) that Gradle picks up on its own.
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK with build number
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk "out/xNglobord-debug-${{ github.run_number }}.apk"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: xNglobord-debug-apk
          path: out/*.apk

      - name: Publish as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Build ${{ github.run_number }}"
          files: out/*.apk
